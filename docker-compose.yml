services:
  postgres:
    image: postgres:15-alpine
    container_name: faculty_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faculty_scheduler_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faculty_scheduler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faculty_scheduler_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/faculty_scheduler_db
      JWT_SECRET_KEY: local_development_super_secret_jwt_key_min_32_characters!
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      TIMEZONE: Asia/Kolkata
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faculty_scheduler_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
